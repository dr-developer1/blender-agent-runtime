[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-agent-runtime"
version = "0.6.0"
description = "A controllable, inspectable machine interface to Blender"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["controller*", "runtime*"]
